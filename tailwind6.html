<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรแกรมคำนวณค่างวดรถยนต์</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class="max-w-3xl mx-auto bg-white rounded-3xl shadow-lg overflow-hidden border border-gray-100 my-8">
        <div class="bg-purple-300 text-white px-6 py-4 rounded-tl-3xl rounded-br-3xl inline-block font-bold text-xl md:text-2xl italic shadow-sm">
            สินเชื่อรถยนต์ - คำนวณการผ่อนชำระต่อเดือน
        </div>

        <div class="p-6 md:p-8 space-y-6">
            <p class="text-gray-400 text-sm font-medium">กรุณาใส่ข้อมูลตามจริงเพื่อการคำนวณที่แม่นยำขึ้น</p>

            <div class="space-y-4">
                
                <div class="flex flex-col md:flex-row md:items-start justify-between gap-2">
                    <label class="text-gray-700 font-bold mt-2">รูปแบบการผ่อนชำระ</label>
                    <div class="w-full md:w-80 space-y-1">
                        <div class="flex border border-blue-300 rounded-full overflow-hidden">
                            <select id="carPaymentType" class="w-full px-4 py-2 text-right outline-none font-bold text-gray-700 bg-white">
                                <option value="normal">แบบปกติ</option>
                            </select>
                        </div>
                        <p class="text-xs text-gray-500 font-medium px-2">
                            <span class="font-bold text-gray-700">แบบปกติ</span> – ส่งค่างวดเท่ากันทุกงวดในแต่ละเดือนตลอดระยะเวลาสัญญา
                        </p>
                    </div>
                </div>

                <div class="flex flex-col md:flex-row md:items-center justify-between gap-2">
                    <label class="text-gray-700 font-bold">ราคารถยนต์</label>
                    <div class="flex border border-blue-300 rounded-full overflow-hidden w-full md:w-80">
                        <input type="number" id="carPrice" placeholder="" oninput="updateCarDownAmount()" class="w-full px-4 py-2 text-right outline-none font-bold text-gray-700">
                        <span class="bg-blue-300 text-white px-4 py-2 text-sm flex items-center font-bold">บาท</span>
                    </div>
                </div>

                <div class="flex flex-col md:flex-row md:items-center justify-between gap-2">
                    <label class="text-gray-700 font-bold">เงินดาวน์ (%)</label>
                    <div class="flex border border-blue-300 rounded-full overflow-hidden w-full md:w-80">
                        <input type="number" id="carDownPercent" placeholder="" oninput="updateCarDownAmount()" class="w-full px-4 py-2 text-right outline-none font-bold text-gray-700">
                        <span class="bg-blue-300 text-white px-4 py-2 text-sm flex items-center font-bold">%</span>
                    </div>
                </div>

                <div class="flex flex-col md:flex-row md:items-center justify-between gap-2">
                    <label class="text-gray-700 font-bold">เงินดาวน์ (บาท)</label>
                    <div class="flex border border-blue-300 rounded-full overflow-hidden w-full md:w-80 bg-gray-50">
                        <input type="text" id="carDownAmountText" readonly placeholder="" class="w-full px-4 py-2 text-right outline-none font-bold text-gray-700 bg-transparent">
                        <span class="bg-blue-300 text-white px-4 py-2 text-sm flex items-center font-bold">บาท</span>
                    </div>
                </div>

                <div class="flex flex-col md:flex-row md:items-center justify-between gap-2">
                    <label class="text-gray-700 font-bold">ระยะเวลาผ่อนชำระ</label>
                    <div class="flex border border-blue-300 rounded-full overflow-hidden w-full md:w-80">
                        <select id="carMonths" class="w-full px-4 py-2 text-right outline-none font-bold text-gray-700 bg-white">
                            <option value="" disabled selected hidden>เลือกระยะเวลาผ่อนชำระ</option>
                            <option value="12">12 เดือน</option>
                            <option value="24">24 เดือน</option>
                            <option value="36">36 เดือน</option>
                            <option value="48">48 เดือน</option>
                            <option value="60">60 เดือน</option>
                            <option value="72">72 เดือน</option>
                            <option value="84">84 เดือน</option>
                        </select>
                    </div>
                </div>

                <div class="flex flex-col md:flex-row md:items-center justify-between gap-2">
                    <label class="text-gray-700 font-bold">อัตราดอกเบี้ยต่อปี</label>
                    <div class="flex border border-blue-300 rounded-full overflow-hidden w-full md:w-80">
                        <input type="number" id="carInterestRate" step="0.1" placeholder="" class="w-full px-4 py-2 text-right outline-none font-bold text-gray-700">
                        <span class="bg-blue-300 text-white px-4 py-2 text-sm flex items-center font-bold">%</span>
                    </div>
                </div>

            </div>

            <div class="flex flex-col md:flex-row gap-4 pt-4">
                <button onclick="resetCarForm()" class="w-full md:w-1/2 bg-gray-400 hover:bg-gray-500 text-white font-bold py-3 rounded-full transition-colors">
                    ตั้งค่าการคำนวณใหม่
                </button>
                <button onclick="calculateCarLoan()" class="w-full md:w-1/2 bg-purple-300 hover:bg-purple-400 text-white font-bold py-3 rounded-full transition-colors shadow-md">
                    คำนวณ
                </button>
            </div>

            <div id="carResultSection" class="hidden pt-2">
                <hr class="border-gray-200 my-6">
                <h3 class="text-purple-900 font-extrabold text-xl mb-4">ผลการคำนวณ</h3>
                <div class="space-y-4">
                    
                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full border border-blue-300 flex items-center justify-center text-blue-400">
                                🚗
                            </div>
                            <span class="font-bold text-gray-700">ยอดจัด</span>
                        </div>
                        <div class="text-right">
                            <span id="carLoanResult" class="text-xl font-extrabold text-gray-800">0</span>
                            <span class="text-gray-600 font-bold ml-2">บาท</span>
                        </div>
                    </div>

                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full border border-blue-300 flex items-center justify-center text-blue-400">
                                💳
                            </div>
                            <span class="font-bold text-gray-700">ค่างวดต่อเดือน</span>
                        </div>
                        <div class="text-right">
                            <span id="carInstallmentResult" class="text-xl font-extrabold text-purple-900">0</span>
                            <span class="text-gray-600 font-bold ml-2">บาท</span>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <script>
        function updateCarDownAmount() {
            const price = parseFloat(document.getElementById('carPrice').value) || 0;
            const percent = parseFloat(document.getElementById('carDownPercent').value) || 0;
            
            if(price > 0 && percent > 0) {
                const downAmount = price * (percent / 100);
                document.getElementById('carDownAmountText').value = downAmount.toLocaleString();
            } else {
                document.getElementById('carDownAmountText').value = "";
            }
        }

        function calculateCarLoan() {
            const price = parseFloat(document.getElementById('carPrice').value) || 0;
            const percent = parseFloat(document.getElementById('carDownPercent').value) || 0;
            const months = parseInt(document.getElementById('carMonths').value) || 0;
            const rate = parseFloat(document.getElementById('carInterestRate').value) || 0;

            if(price <= 0 || months <= 0) {
                alert("กรุณากรอกข้อมูลให้ครบถ้วน");
                return;
            }

            const downAmount = price * (percent / 100);
            const loanAmount = price - downAmount;

            const years = months / 12;
            const totalInterest = loanAmount * (rate / 100) * years;
            const totalPayment = loanAmount + totalInterest;

            const monthlyInstallment = totalPayment / months;

            document.getElementById('carLoanResult').innerText = Math.round(loanAmount).toLocaleString();
            document.getElementById('carInstallmentResult').innerText = Math.round(monthlyInstallment).toLocaleString();
            
            document.getElementById('carResultSection').classList.remove('hidden');
        }

        function resetCarForm() {
            document.getElementById('carPrice').value = "";
            document.getElementById('carDownPercent').value = "";
            document.getElementById('carDownAmountText').value = "";
            document.getElementById('carMonths').value = "";
            document.getElementById('carInterestRate').value = "";
            
            document.getElementById('carResultSection').classList.add('hidden');
        }
    </script>
</body>
</html>
