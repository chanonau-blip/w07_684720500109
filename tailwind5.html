<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class="relative min-h-screen bg-blue-50 text-center mx-auto justify-self-center py-4 px-4">
        <div class="max-w-4xl space-y-3 mx-auto">
            <h2 class="text-xl text-center text-purple-950 font-bold">โปรแกรมคำนวณหาค่าดัชนีมวลกาย (BMI)</h2>
            <div class="h-[2px] w-64 mx-auto bg-gradient-to-r from-red-600 via-purple-600 to-blue-600 rounded-full"></div>            
            <h2 class="text-purple-950 text-sm font-bold py-2 rounded-full bg-blue-200 w-fit  mx-auto px-4">Calculator CT</h2>
            <div class="flex justify-self-center w-2xl rounded-lg overflow-hidden">
                <img class="object-cover" src="https://www.masterpiecehospital.com/wp-content/uploads/2025/12/BMI-01-scaled.webp"/>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-left">
                <div class="bg-white p-6 rounded-2xl space-y-4">
                    <div class="relative border border-gray-300 rounded-xl p-2 focus-within:border-blue-500">
                        <label class="absolute -top-3 left-3 bg-white px-1 text-gray-500">น้ำหนัก</label>
                        <div class="flex justify-between items-center">
                            <input class="w-full outline-none text-gray-700 text-xs" type="number" id="weightInput" placeholder="เช่น 60">
                            <span class="text-gray-400 text-sm pl-2">กิโลกรัม</span>
                        </div>
                    </div>
                    <div class="relative border border-gray-300 rounded-xl p-3 focus-within:border-blue-500">
                        <label class="absolute -top-3 left-3 bg-white px-1 text-gray-500">ส่วนสูง</label>
                        <div class="flex justify-between items-center">
                            <input class="w-full text-xs text-gray-700 outline-none" type="number" id="heightInput" placeholder="เช่น 170">
                            <span class="text-gray-400 text-sm pl-2">เซนติเมตร</span>
                        </div>
                    </div>
                    <button onclick="displayBMI()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-xl shadow-md transition-colors">คำนวณ BMI</button>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm flex flex-col justify-center items-center text-center space-y-3">
                    <p class="text-gray-400 font-medium">ค่า BMI ของคุณ :</p>
                    <h1 id="bmiResult" class="text-xl font-extrabold text-blue-400"></h1>
                    <p id="statusResult" class="text-gray-400 text-sm py-1 rounded-full">กรอกน้ำหนักและส่วนสูงเพื่อคำนวณค่าดัชนีมวลกาย</p>
                    <img id="bmiImage" class="w-36 rounded-lg mt-2 hidden" src="" alt="เกณฑ์ bmi">
                </div>
            </div>
        </div>
    </div>
    <script>
        function CalculateBMI(weight, heightinCM){
            const heightinM = heightinCM / 100;
            const bmi=weight/(heightinM*heightinM)

            let status ="";

            if(bmi < 18.5){
                status = "น้ำหนักน้อยกว่าเกณฑ์(ผอม)";
            }else if (bmi >= 18.5 && bmi <23){
                status = "น้ำหนักปกติ";
            }else if (bmi >= 23 && bmi <25){
                status = "ท้วม/น้ำหนักเกิน";
            }else if (bmi >= 25 && bmi <30){
                status = "อ้วนระดับ 1";
            }else {
                status = "อ้วนระดับ 2 (อ้วนมาก)";
            }

            return {
                bmiValue:bmi.toFixed(2),
                category:status,
            };
            }

            function displayBMI() {
                const w = document.getElementById('weightInput').value;
                const h = document.getElementById('heightInput').value;

                if(w > 0 && h > 0) {
                    const result = CalculateBMI(w,h);
                    document.getElementById('bmiResult').innerText = result.bmiValue;
                    document.getElementById('statusResult').innerText = result.category;
                }
            }
    </script>
</body>
</html>
