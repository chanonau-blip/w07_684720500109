<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>BMI Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div></div>
    <div class="justify-self-center drop-shadow-xl">
        <!-- 1. ส่วนรับค่าและแสดงผลใน HTML -->
        <h2 class="text-center text-gray-800 font-bold py-2">โปรแกรมคำนวณหาค่าดัชนีมวลกาย (BMI)</h2>
        <input class="" type="number" id="weightInput" placeholder="น้ำหนัก (kg)">
        <input class="" type="number" id="heightInput" placeholder="ส่วนสูง (cm)">
        <button onclick="displayBMI()" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded inline-flex items-center">คำนวณ</button>
        
        <h3 id="bmiResult"></h3>
        <p id="statusResult"></p>
        <img id="bmiImage" src="" alt="" style="width:150px;">
    </div>
    <script>
        function CalculateBMI(weight, heightinCM){
            const heightinM = heightinCM / 100;
            const bmi=weight/(heightinM*heightinM)

            let status ="";
            let imgSrc ="";

            if(bmi < 18.5){
                status = "น้ำหนักน้อยกว่าเกณฑ์(ผอม)";
                imgSrc = "https://www.srenebyslc.com/wp-content/uploads/2025/01/Content_BMI1200x800_02.jpg";
            }else if (bmi >= 18.5 && bmi <23){
                status = "น้ำหนักปกติ";
                imgSrc = "https://www.srenebyslc.com/wp-content/uploads/2025/01/Content_BMI1200x800_02.jpg";
            }else if (bmi >= 23 && bmi <25){
                status = "ท้วม/น้ำหนักเกิน";
                imgSrc = "https://www.srenebyslc.com/wp-content/uploads/2025/01/Content_BMI1200x800_02.jpg";
            }else if (bmi >= 25 && bmi <30){
                status = "อ้วนระดับ 1";
                imgSrc = "https://www.srenebyslc.com/wp-content/uploads/2025/01/Content_BMI1200x800_02.jpg";
            }else {
                status = "อ้วนระดับ 2 (อ้วนมาก)";
                imgSrc = "https://www.srenebyslc.com/wp-content/uploads/2025/01/Content_BMI1200x800_02.jpg";
            }

            return {
                bmiValue:bmi.toFixed(2),
                category:status,
                Image:imgSrc
            };
            }

            function displayBMI() {
                const w = document.getElementById('weightInput').value;
                const h = document.getElementById('heightInput').value;

                if(w > 0 && h > 0) {
                    const result = CalculateBMI(w,h);
                    document.getElementById('bmiResult').innerText = "ค่า BMI:" + result.bmiValue;
                    document.getElementById('statusResult').innerText = "เกณฑ์:" + result.category;
                    document.getElementById('bmiImage').src= result.Image;
                }
            }
    </script>
</body>
</html>
